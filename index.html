<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>PVT練習テスト</title>
<style>
body {
    text-align: center;
    font-family: Arial, sans-serif;
    margin-top: 100px;
}

#box {
    width: 300px;
    height: 200px;
    background: gray;
    margin: auto;
    line-height: 200px;
    font-size: 40px;
    color: white;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
}

#box.waiting {
    font-size: 80px;
}

.instruction {
    font-size: 40px;
    font-weight: bold;
}

#enterStart {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    justify-content: center;
    background: white;
    color: #111;
    font-size: 24px;
    font-weight: bold;
    user-select: none;
}

#preparationMessage {
    min-height: 36px;
    margin-top: 18px;
    font-size: 20px;
}

#countdown {
    min-height: 58px;
    margin-top: 8px;
    font-size: 48px;
    font-weight: bold;
}

#result {
    display: none;
    max-width: 620px;
    margin: 25px auto;
    padding: 18px 24px;
    text-align: left;
    font-size: 20px;
    background: #f7f7f7;
    border: 1px solid #bbb;
    border-radius: 10px;
}

#result h3 {
    margin-top: 0;
    text-align: center;
}

#result p {
    margin: 8px 0;
}

#result .judgment {
    margin-top: 20px;
    padding: 12px;
    text-align: center;
    font-size: 30px;
    font-weight: bold;
    border-radius: 8px;
}

#result .pass {
    color: #a40000;
    background: #fdeaea;
    border: 2px solid #d64040;
}

#result .fail {
    color: #004a99;
    background: #e9f3ff;
    border: 2px solid #4b90d9;
}
</style>
</head>

<body>

<div id="enterStart" aria-live="polite">
    Enterキーを押して待機を開始してください
</div>

<p id="taskInstruction" class="instruction" style="visibility:hidden;">
    赤になったらすぐEnterキー！
</p>

<div id="box" class="waiting">✖</div>
<div id="countdown"></div>
<div id="preparationMessage"></div>
<div id="result"></div>

<script>
'use strict';

const TEST_DURATION = 30000;        // 練習本体：30秒
const PREPARATION_DURATION = 30000; // 開始前の注視点：30秒
const COUNTDOWN_DURATION = 5000;    // 開始5秒前からカウントダウン

let startTime;
let waiting = false;
let isRunning = false;
let isPreparing = false;
let preparationStarted = false;
let nextStimulusPerfTime;

let stimulusTimer = null;
let forceEndTimer = null;
let preparationTimer = null;
let countdownStartTimer = null;
let countdownInterval = null;

let results = [];
let audioContext = null;
let keyLocked = false;

const box = document.getElementById("box");
const enterStartDiv = document.getElementById("enterStart");
const taskInstruction = document.getElementById("taskInstruction");
const countdownDiv = document.getElementById("countdown");
const preparationMessage = document.getElementById("preparationMessage");
const resultDiv = document.getElementById("result");

//====================
// 音声
//====================
function getAudioContext() {
    if (!audioContext) {
        const AudioContextClass =
            window.AudioContext || window.webkitAudioContext;

        if (AudioContextClass) {
            audioContext = new AudioContextClass();
        }
    }

    return audioContext;
}

async function playTone(frequency, durationMs, volume = 0.20) {
    try {
        const context = getAudioContext();
        if (!context) return false;

        if (context.state !== "running") {
            await context.resume();
        }

        const oscillator = context.createOscillator();
        const gain = context.createGain();
        const now = context.currentTime;
        const duration = durationMs / 1000;
        const attack = Math.min(0.08, duration * 0.25);
        const release = Math.min(0.22, duration * 0.45);

        oscillator.type = "sine";
        oscillator.frequency.setValueAtTime(frequency, now);

        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(volume, now + attack);
        gain.gain.setValueAtTime(
            volume,
            now + Math.max(attack, duration - release)
        );
        gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(now);
        oscillator.stop(now + duration);

        return true;
    } catch (error) {
        console.error("音声を再生できませんでした。", error);
        return false;
    }
}

function unlockAudio() {
    try {
        const context = getAudioContext();
        if (!context) return;

        if (context.state !== "running") {
            void context.resume();
        }

        const oscillator = context.createOscillator();
        const gain = context.createGain();
        gain.gain.setValueAtTime(0.0001, context.currentTime);
        oscillator.connect(gain);
        gain.connect(context.destination);
        oscillator.start(context.currentTime);
        oscillator.stop(context.currentTime + 0.02);
    } catch (error) {
        console.warn("音声の初期化に失敗しました。", error);
    }
}

//====================
// 開始前の30秒待機
//====================
function beginPreparation() {
    if (preparationStarted || isPreparing || isRunning) return;

    preparationStarted = true;
    isPreparing = true;
    results = [];
    resultDiv.style.display = "none";
    resultDiv.innerHTML = "";

    unlockAudio();

    enterStartDiv.style.display = "none";
    taskInstruction.style.visibility = "hidden";

    box.style.background = "gray";
    box.classList.add("waiting");
    box.textContent = "✖";

    countdownDiv.textContent = "";
    preparationMessage.textContent =
        "開始まで注視点を見て待機してください";

    countdownStartTimer = setTimeout(
        startCountdown,
        PREPARATION_DURATION - COUNTDOWN_DURATION
    );

    preparationTimer = setTimeout(
        beginTask,
        PREPARATION_DURATION
    );
}

// 最初のEnterで音声を有効化し、30秒待機を開始する。
document.addEventListener("keydown", (event) => {
    if (event.key !== "Enter" || event.repeat) return;
    if (preparationStarted || isPreparing || isRunning) return;

    event.preventDefault();
    beginPreparation();
});

function startCountdown() {
    if (!isPreparing) return;

    // タスク開始5秒前の音。
    void playTone(659.25, 500, 0.20);

    preparationMessage.textContent = "";

    let remaining = 5;
    countdownDiv.textContent = remaining;

    countdownInterval = setInterval(() => {
        remaining--;
        countdownDiv.textContent = remaining > 0 ? remaining : "";

        if (remaining <= 0) {
            clearInterval(countdownInterval);
        }
    }, 1000);
}

//====================
// 練習本体開始
//====================
function beginTask() {
    if (!isPreparing) return;

    isPreparing = false;
    isRunning = true;

    clearInterval(countdownInterval);
    countdownDiv.textContent = "";
    preparationMessage.textContent = "";
    taskInstruction.style.visibility = "visible";

    // タスク開始時の音。5秒前より高い音にして区別する。
    void playTone(880, 600, 0.22);

    forceEndTimer = setTimeout(() => {
        if (isRunning) {
            endTest();
        }
    }, TEST_DURATION);

    startTest();
}

//====================
// 試行開始
//====================
function startTest() {
    if (!isRunning) return;

    box.style.background = "gray";
    box.classList.add("waiting");
    box.textContent = "✖";

    waiting = true;

    // 1,000 ms以上、4,000 ms未満のランダム待機。
    const delay = Math.random() * 3000 + 1000;

    nextStimulusPerfTime = performance.now() + delay;

    stimulusTimer = setTimeout(() => {
        if (!isRunning) return;

        requestAnimationFrame(() => {
            if (!isRunning) return;

            box.style.background = "red";
            box.classList.remove("waiting");
            box.textContent = "Enter!";

            startTime = performance.now();
            waiting = false;
        });
    }, delay);
}

//====================
// PVT反応用Enter
//====================
document.addEventListener("keydown", (event) => {
    if (event.key !== "Enter") return;
    if (keyLocked) return;

    keyLocked = true;
    handleResponse();
});

document.addEventListener("keyup", (event) => {
    if (event.key === "Enter") {
        keyLocked = false;
    }
});

//====================
// 反応処理
//====================
function handleResponse() {
    if (!isRunning) return;

    // 赤刺激提示前の先行反応。
    if (waiting) {
        const remaining = Math.round(
            nextStimulusPerfTime - performance.now()
        );

        results.push(-remaining);
        return;
    }

    // 赤刺激提示後の通常反応。
    const rt = Math.round(
        performance.now() - startTime
    );

    results.push(rt);
    startTest();
}

//====================
// 結果表示
//====================
function showResult() {
    let anticipation = 0;
    let early = 0;
    let valid = 0;
    let lapse = 0;
    let noResponse = 0;

    results.forEach((rt) => {
        // 排他的に分類する。
        if (rt < 0) {
            anticipation++;
        } else if (rt <= 100) {
            early++;
        } else if (rt < 500) {
            valid++;
        } else if (rt < 10000) {
            lapse++;
        } else {
            noResponse++;
        }
    });

    const passed =
        (valid + lapse >= 3) &&
        (anticipation + early <= 2) &&
        (noResponse <= 1);

    resultDiv.innerHTML = `
        <h3>結果</h3>
        <p>先行反応：${anticipation} 回</p>
        <p>早期反応：${early} 回</p>
        <p>有効反応：${valid} 回</p>
        <p>ラプス反応：${lapse} 回</p>
        <p>無反応：${noResponse} 回</p>
        <div class="judgment ${passed ? "pass" : "fail"}">
            ${passed ? "合格" : "不合格"}
        </div>
    `;

    resultDiv.style.display = "block";
}

//====================
// テスト終了
//====================
function endTest() {
    if (!isRunning) return;

    isRunning = false;
    waiting = false;

    clearTimeout(stimulusTimer);
    clearTimeout(forceEndTimer);

    box.style.background = "black";
    box.classList.remove("waiting");
    box.textContent = "終了";

    countdownDiv.textContent = "";
    preparationMessage.textContent = "";
    taskInstruction.style.visibility = "hidden";

    // 赤刺激表示中に終了した場合は、終了時点までのRTを記録する。
    if (startTime !== undefined) {
        const rt = Math.round(performance.now() - startTime);
        if (!waiting && rt >= 0) {
            results.push(rt);
        }
    }

    showResult();
}
</script>

</body>
</html>
